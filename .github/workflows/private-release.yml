name: Kernova OS private release

on:
  push:
    branches: [main]
    paths:
      - product.json
      - packages/debian/changelog
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' product.json)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if git ls-remote --exit-code \
              "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists. Bump the release version for a new update."
              exit 0
            else
              status=$?
              [[ "$status" == 2 ]] || exit "$status"
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Build Debian packages
        if: steps.version.outputs.build == 'true'
        run: |
          docker run --rm --volume "$PWD:/source" --workdir /source debian:trixie \
            bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends build-essential dpkg-dev \
                debhelper dh-sequence-python3 python3 librsvg2-bin desktop-file-utils
              setpriv --reuid "$1" --regid "$2" --clear-groups \
                env HOME=/tmp python3 scripts/build-packages artifacts/github-release
            ' bash "$(id -u)" "$(id -g)"
          (cd artifacts/github-release && sha256sum -- *.deb > SHA256SUMS)

      - name: Publish packages to private GitHub Releases
        if: github.event_name == 'push' && steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == true ]]
          gh release create "$TAG" artifacts/github-release/*.deb artifacts/github-release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Kernova OS $TAG" --generate-notes --prerelease
